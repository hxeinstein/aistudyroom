<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#7EC8F2" />
  <title>숲속 독서실</title>
  <meta name="description" content="자리에 앉아 공부를 시작하면 스터디플래너가 자동으로 완성되는 3D 독서실" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="world"></div>

  <!-- 상단 HUD -->
  <header class="hud hud-left">
    <div class="pill">
      <button class="icon-btn" id="btnPlanner" title="스터디플래너">📒</button>
      <div class="room">
        <strong>숲속 독서실</strong>
        <span id="seatLabel">자리를 골라 앉아보세요</span>
      </div>
    </div>
  </header>
  <header class="hud hud-right">
    <div class="pill">
      <div class="today" title="오늘 공부 시간"><small>오늘</small><strong id="todayTotal">0분</strong></div>
      <button class="icon-btn" id="btnSound" title="소리 끄기">🔇</button>
      <button class="icon-btn" id="btnSettings" title="설정">⚙️</button>
    </div>
  </header>

  <!-- 하단 행동 바 -->
  <nav class="actionbar" id="actionbar"></nav>

  <!-- 공부 중 패널 -->
  <section class="study-panel hidden" id="studyPanel">
    <div class="study-head">
      <span class="chip" id="studySubject">수학</span>
      <span class="study-title" id="studyTitle"></span>
    </div>
    <div class="timer" id="studyTimer">00:00:00</div>
    <div class="study-sub" id="studySub">집중 중… 스탠드가 켜졌어요 💡</div>
    <div class="study-btns">
      <button class="btn soft" id="btnPause">☕ 잠깐 휴식</button>
      <button class="btn soft" id="btnAsk">🐾 질문</button>
      <button class="btn primary" id="btnStop">⏹ 이 공부 끝</button>
    </div>
  </section>

  <!-- 과학 질문 챗봇 -->
  <section class="chat-sheet hidden" id="chatSheet" aria-label="과학 질문">
    <header class="c-head">
      <img class="c-ava big" src="assets/mascot.png" alt="" />
      <div class="c-title"><strong id="cName">과학 도우미</strong><span>역학과 에너지 · 정답 대신 힌트를 줘요</span></div>
      <button class="c-ghost" id="cReset" type="button">새 문제</button>
      <button class="icon-btn" id="cClose" type="button" aria-label="닫기">✕</button>
    </header>
    <div class="c-log" id="cLog"></div>
    <div class="c-gate hidden" id="cGate">
      <p>선생님이 알려준 <b>수업 코드</b>를 넣어 줘.</p>
      <div class="row"><input class="field" id="cCodeInput" autocomplete="off" aria-label="수업 코드" /><button class="btn primary" id="cCodeBtn" type="button">확인</button></div>
      <div class="c-gate-msg" id="cGateMsg"></div>
    </div>
    <footer class="c-foot">
      <div class="c-preview hidden" id="cPreview"><img id="cPreviewImg" alt="올릴 사진" /><span>사진 1장</span><button class="c-ghost" id="cRemoveImg" type="button">빼기</button></div>
      <div class="c-compose">
        <button class="icon-btn" id="cPhoto" type="button" aria-label="문제 사진 올리기">📷</button>
        <input type="file" id="cFile" accept="image/*" hidden />
        <textarea id="cInput" rows="1" placeholder="문제나 내 풀이를 써 줘"></textarea>
        <button class="btn primary" id="cSend" type="button">보내기</button>
      </div>
      <p class="c-hint">대화는 저장되지 않아요 · 창을 닫아도 이 화면을 새로고침하기 전까지는 남아 있어요</p>
    </footer>
  </section>

  <div class="toast hidden" id="toast"></div>

  <!-- 모달 -->
  <div class="modal-wrap hidden" id="modalWrap">
    <div class="modal" id="modal"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
