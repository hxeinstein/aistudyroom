<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F7FA;
    --grid: #DCE5EE;
    --ink: #1E3550;
    --ink-soft: #52667D;
    --card: #FFFFFF;
    --mark: #FFE46B;
    --mark-ink: #3B3000;
    --warn: #B4401A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #142131; --grid: #1D2E42; --ink: #E3ECF5; --ink-soft: #9FB2C6;
      --card: #1B2B3F; --mark: #E8C93A; --mark-ink: #1A1500; --warn: #FF9C7A;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    display: flex; flex-direction: column;
  }
  header {
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px;
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; font-size: 0.82rem; color: var(--ink-soft); }
  .ghost {
    font: inherit; font-size: 0.82rem; color: var(--ink); background: none;
    border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
  }
  main { flex: 1; overflow-y: auto; padding: 18px 14px 8px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; line-height: 1.65; font-size: 0.97rem; word-break: keep-all; overflow-wrap: anywhere; }
  .coach {
    align-self: flex-start; background: var(--card);
    border-left: 4px solid var(--ink); border-radius: 2px 10px 10px 2px;
    padding: 12px 14px; box-shadow: 0 1px 0 var(--grid);
  }
  .me {
    align-self: flex-end; background: var(--ink); color: var(--paper);
    border-radius: 10px 10px 2px 10px; padding: 10px 14px;
  }
  .me img { display: block; max-width: 100%; max-height: 240px; border-radius: 6px; margin-bottom: 6px; }
  .error { align-self: center; color: var(--warn); font-size: 0.88rem; text-align: center; padding: 4px 8px; }
  .page {
    background: var(--mark); color: var(--mark-ink); font-weight: 600;
    padding: 1px 6px; border-radius: 3px; white-space: nowrap;
  }
  .thinking span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--ink-soft); animation: blink 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: .2s; } .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .thinking span { animation: none; opacity: .6; } }

  footer {
    background: var(--paper); border-top: 2px solid var(--ink);
    padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px);
  }
  .composer { max-width: 720px; margin: 0 auto; }
  .preview { display: none; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.85rem; color: var(--ink-soft); }
  .preview img { height: 52px; border-radius: 4px; border: 1px solid var(--grid); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--ink-soft); border-radius: 8px;
    padding: 10px 12px; max-height: 140px; line-height: 1.45;
  }
  textarea:focus, button:focus-visible, input:focus-visible { outline: 3px solid var(--mark); outline-offset: 1px; }
  .icon, .send {
    height: 44px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600;
  }
  .icon { width: 44px; background: var(--card); color: var(--ink); border: 1.5px solid var(--ink-soft); font-size: 1.2rem; }
  .send { padding: 0 16px; background: var(--ink); color: var(--paper); border: none; }
  .send:disabled { opacity: .45; cursor: default; }

  #gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: var(--paper); padding: 24px; }
  #gate .box { width: 100%; max-width: 340px; background: var(--card); border: 2px solid var(--ink); border-radius: 10px; padding: 22px; }
  #gate h2 { margin: 0 0 6px; font-size: 1.1rem; }
  #gate p { margin: 0 0 14px; color: var(--ink-soft); font-size: 0.9rem; }
  #gate input { width: 100%; font: inherit; font-size: 1.05rem; padding: 10px 12px; border: 1.5px solid var(--ink-soft); border-radius: 8px; margin-bottom: 10px; background: var(--paper); color: var(--ink); }
  #gate .send { width: 100%; }
  #gateMsg { color: var(--warn); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>역학과 에너지 힌트 코치</h1>
      <p>정답 대신 힌트를 줘요. 교과서 쪽수도 알려줘요.</p>
    </div>
    <button class="ghost" id="resetBtn" type="button">새 문제</button>
  </header>

  <main id="log"><div class="wrap" id="wrap"></div></main>

  <footer>
    <div class="composer">
      <div class="preview" id="preview">
        <img id="previewImg" alt="올릴 사진 미리보기">
        <span>사진 1장</span>
        <button class="ghost" id="removeImg" type="button">빼기</button>
      </div>
      <div class="row">
        <button class="icon" id="photoBtn" type="button" aria-label="문제 사진 올리기">📷</button>
        <input type="file" id="file" accept="image/*" hidden>
        <textarea id="input" rows="1" placeholder="문제나 내 풀이를 써 줘"></textarea>
        <button class="send" id="sendBtn" type="button">보내기</button>
      </div>
    </div>
  </footer>

  <div id="gate">
    <div class="box">
      <h2>수업 코드 입력</h2>
      <p>선생님이 알려준 코드를 넣어 줘.</p>
      <input id="codeInput" autocomplete="off" inputmode="text" aria-label="수업 코드">
      <button class="send" id="codeBtn" type="button">들어가기</button>
      <div id="gateMsg"></div>
    </div>
  </div>

<script>
  const GREETING = '어떤 문제를 풀어 볼까? 문제를 글로 쓰거나 사진으로 올려 줘!';
  let history = [];          // 서버로 보내는 대화 기록 (첫 인사는 제외)
  let pendingImage = null;   // { mimeType, data, url }
  let accessCode = '';
  let busy = false;

  const $ = id => document.getElementById(id);
  const wrap = $('wrap'), log = $('log'), input = $('input'), sendBtn = $('sendBtn');

  function store(k, v) { try { v === undefined ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }

  /* ---------- 화면에 말풍선 그리기 ---------- */
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function render(text) {
    let h = escapeHtml(text);
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/교과서\s*(\d+)(\s*[~\-–]\s*\d+)?\s*쪽/g, (m) => '<span class="page">' + m + '</span>');
    return h.replace(/\n/g, '<br>');
  }
  function addBubble(role, text, imgUrl) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'me' : 'coach');
    if (imgUrl) { const im = document.createElement('img'); im.src = imgUrl; im.alt = '올린 문제 사진'; div.appendChild(im); }
    if (text) { const s = document.createElement('div'); s.innerHTML = role === 'user' ? escapeHtml(text).replace(/\n/g, '<br>') : render(text); div.appendChild(s); }
    wrap.appendChild(div); scrollDown(); return div;
  }
  function addNote(text) {
    const div = document.createElement('div'); div.className = 'error'; div.textContent = text;
    wrap.appendChild(div); scrollDown();
  }
  function scrollDown() { log.scrollTop = log.scrollHeight; }

  /* ---------- 사진: 휴대폰 사진을 1280px로 줄여서 전송 ---------- */
  $('photoBtn').onclick = () => $('file').click();
  $('file').onchange = e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1280, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.85);
        pendingImage = { mimeType: 'image/jpeg', data: url.split(',')[1], url: url };
        $('previewImg').src = url; $('preview').style.display = 'flex';
      };
      img.onerror = () => addNote('이 사진은 열 수 없어요. 다른 사진으로 올려 줘.');
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  };
  $('removeImg').onclick = clearImage;
  function clearImage() { pendingImage = null; $('preview').style.display = 'none'; }

  /* ---------- 보내기 ---------- */
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
  input.addEventListener('keydown', e => {
    // 한글 입력 중(isComposing)에는 Enter로 보내지 않음 → 두 번 전송 방지
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer: fine)').matches) {
      e.preventDefault(); send();
    }
  });
  sendBtn.onclick = send;

  function send() {
    const text = input.value.trim();
    if (busy || (!text && !pendingImage)) return;
    const msg = { role: 'user', text: text };
    if (pendingImage) msg.image = { mimeType: pendingImage.mimeType, data: pendingImage.data };
    addBubble('user', text, pendingImage && pendingImage.url);
    history.push(msg);
    input.value = ''; input.style.height = 'auto'; clearImage();
    setBusy(true);
    const thinking = addBubble('model', '');
    thinking.classList.add('thinking'); thinking.innerHTML = '<span></span><span></span><span></span>';

    google.script.run
      .withSuccessHandler(res => {
        thinking.remove(); setBusy(false);
        if (res && res.text) {
          history.push({ role: 'model', text: res.text });
          addBubble('model', res.text);
        } else { fail(res && res.error, msg); }
      })
      .withFailureHandler(err => { thinking.remove(); setBusy(false); fail('연결이 끊겼어요. 다시 보내 줘.', msg); })
      .chat({ code: accessCode, history: history });
  }
  function fail(text, msg) {
    history.pop();                 // 실패한 질문은 기록에서 빼고 입력칸에 돌려놓기
    if (msg.text) input.value = msg.text;
    addNote(text || '답을 받지 못했어요. 다시 보내 줘.');
  }
  function setBusy(b) { busy = b; sendBtn.disabled = b; sendBtn.textContent = b ? '생각 중' : '보내기'; }

  $('resetBtn').onclick = () => {
    if (busy) return;
    if (history.length && !confirm('지금 대화를 지우고 새 문제를 시작할까?')) return;
    history = []; wrap.innerHTML = ''; clearImage(); addBubble('model', GREETING); input.focus();
  };

  /* ---------- 수업 코드 ---------- */
  function startChat() { $('gate').style.display = 'none'; addBubble('model', GREETING); }
  $('codeBtn').onclick = tryCode;
  $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) tryCode(); });
  function tryCode() {
    const code = $('codeInput').value.trim();
    if (!code) return;
    $('gateMsg').textContent = '';
    google.script.run.withSuccessHandler(ok => {
      if (ok) { accessCode = code; store('hintCode', code); startChat(); }
      else $('gateMsg').textContent = '코드가 맞지 않아요. 다시 확인해 줘.';
    }).checkCode(code);
  }

  google.script.run.withSuccessHandler(cfg => {
    if (!cfg.needCode) return startChat();
    const saved = load('hintCode');
    if (saved) {
      google.script.run.withSuccessHandler(ok => {
        if (ok) { accessCode = saved; startChat(); } else { store('hintCode'); $('gate').style.display = 'flex'; }
      }).checkCode(saved);
    } else { $('gate').style.display = 'flex'; $('codeInput').focus(); }
  }).withFailureHandler(() => addNote('설정을 불러오지 못했어요. 새로고침해 줘.')).getConfig();
</script>
</body>
</html>
